name: Packaging

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Generate cargo sources
        run: |
          pip3 install aiohttp tomlkit
          curl -fsSLO https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json

      - name: Build Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --repo=repo --install-deps-from=flathub --force-clean build-dir packaging/flatpak/org.artcraft.app.yml
          flatpak build-bundle repo org.artcraft.app.flatpak org.artcraft.app
