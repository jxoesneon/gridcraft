# Flatpak manifest for GridCraft
id: org.artcraft.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gridcraft
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: gridcraft
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/gridcraft/cargo
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --locked -p gridcraft -p gridcraft-cli
      - install -Dm755 target/release/gridcraft /app/bin/gridcraft
      - install -Dm755 target/release/gridcraft-cli /app/bin/gridcraft-cli
      - install -Dm644 packaging/linux/ai.storyteller.gridcraft.desktop /app/share/applications/org.artcraft.app.desktop
      - sed -i 's/ai.storyteller.gridcraft/org.artcraft.app/g' /app/share/applications/org.artcraft.app.desktop
      - install -Dm644 packaging/linux/ai.storyteller.gridcraft.mime.xml /app/share/mime/packages/org.artcraft.app.xml
      - mkdir -p /app/share/icons && cp -R assets/app-icon/hicolor /app/share/icons/
      - find /app/share/icons -type f -name "ai.storyteller.gridcraft.*" | while read -r f; do mv "$f" "$(echo "$f" | sed 's/ai.storyteller.gridcraft/org.artcraft.app/')"; done
      - >-
        version=$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml);
        install -d /app/share/metainfo;
        sed -e "s/@VERSION@/$version/" -e "s/@DATE@/$(date -u +%Y-%m-%d)/" -e "s/ai.storyteller.gridcraft/org.artcraft.app/g"
        packaging/linux/ai.storyteller.gridcraft.metainfo.xml.in > /app/share/metainfo/org.artcraft.app.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - target-xtask
          - dist
          - corpus
          - build-flatpak
          - .flatpak-builder
      - cargo-sources.json
