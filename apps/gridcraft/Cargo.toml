[package]
name = "gridcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "gridcraft"
description = "GridCraft: an open-source, sovereign spreadsheet powered by Martensite"

[lints]
workspace = true

[dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-martensite = { path = "../../crates/ui-martensite" }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
# Icon + VERSIONINFO for gridcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"
